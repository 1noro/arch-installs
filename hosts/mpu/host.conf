# mpu — sobremesa: Intel i5-11600K (Z590), Radeon RX 580, NVMe Samsung PM9A1, 16 GB.
# shellcheck disable=SC2034

DISK_PREFER='^/dev/nvme'

PACKAGE_SETS=(gnome cli dev apps media gaming printing virt)

# Parámetros del kernel propios de este equipo.
# irqpoll: lo llevas puesto desde hace tiempo en el GRUB real de mpu; ¿sigue siendo
# necesario? Si no, quítalo (consume CPU en el polling de interrupciones).
KERNEL_CMDLINE_EXTRA="irqpoll"
GRUB_GFXMODE=2560x1440x32

SERVICES+=(docker avahi-daemon cups.service lactd)
# servicios de paquetes AUR: se activan en post-install.sh
POST_SERVICES=(mullvad-daemon mullvad-early-boot-blocking)
