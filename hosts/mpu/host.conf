# mpu — sobremesa: Intel i5-11600K (Z590), Radeon RX 580, NVMe Samsung 980 PRO 1 TB, 16 GB.
# Firmware del NVMe: mpu tiene 3B2QGXA7; actualizar a 5B2QGXA7 (ISO de Samsung, no lo hace el instalador).
# shellcheck disable=SC2034

DISK_PREFER='^/dev/nvme'

PACKAGE_SETS=(gnome cli dev apps media gaming printing virt)

# Parámetros del kernel propios de este equipo: ninguno. irqpoll (puesto hace años)
# se quitó en 2026-11 sin problemas; además hacía que irq/9-acpi gastara CPU sin
# interrupciones reales.
KERNEL_CMDLINE_EXTRA=""
GRUB_GFXMODE=2560x1440x32

SERVICES+=(docker avahi-daemon cups.service lactd)
# servicios de paquetes AUR: se activan en post-install.sh
POST_SERVICES=(mullvad-daemon mullvad-early-boot-blocking)
