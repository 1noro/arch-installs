# hosts/defaults.conf — valores por defecto para todos los equipos.
# hosts/<host>/host.conf se carga DESPUÉS y puede sobrescribir cualquiera.
# Es un fichero bash: se carga con `source`.
# shellcheck disable=SC2034  # las variables se usan desde los scripts que lo cargan

# -- usuario ---------------------------------------------------------------------
USERNAME=cosmo
USER_SHELL=/bin/bash
# grupos del usuario (solo se añaden los que existan tras instalar los paquetes)
USER_GROUPS=(wheel lp docker vboxusers)

# -- regionalización -----------------------------------------------------------------
TIMEZONE=Europe/Madrid
LOCALES=(gl_ES.UTF-8 es_ES.UTF-8 en_US.UTF-8)
LANG_DEFAULT=gl_ES.UTF-8
KEYMAP=us            # consola (tty) y GDM
X11_LAYOUT=us        # GNOME / GDM
X11_VARIANT=intl
HOST_DOMAIN=jamaica.h.a3do.net

# -- disco ---------------------------------------------------------------------------
# DISK vacío = autodetectar (se puede forzar con `install.sh --disk /dev/xxx`).
DISK=""
# Si hay varios discos candidatos, regex (sobre /dev/xxx y modelo) para preferir uno
DISK_PREFER=""
ESP_SIZE_MIB=1024    # la ESP es /boot (kernel + initramfs + GRUB)
SWAP_SIZE_GIB=auto   # auto = igual a la RAM (mín. 2, máx. SWAP_MAX_GIB); 0 = sin swap
SWAP_MAX_GIB=32
FS_LABEL=system
# subvolumen:punto-de-montaje (el orden importa: padres antes que hijos)
BTRFS_SUBVOLS=(
    "@:/"
    "@home:/home"
    "@snapshots:/.snapshots"
    "@var_log:/var/log"
    "@var_cache:/var/cache"
    "@docker:/var/lib/docker"
)
BTRFS_OPTS=noatime,compress=zstd:3

# -- pacman ----------------------------------------------------------------------------
MIRROR_COUNTRIES="ES,PT,FR"   # reflector
# mirrors de respaldo si reflector falla
MIRRORS_FALLBACK=(
    "https://mirror.librelabucm.org/archlinux/\$repo/os/\$arch"
    "https://ftp.rediris.es/mirror/archlinux/\$repo/os/\$arch"
    "https://geo.mirror.pkgbuild.com/\$repo/os/\$arch"
)

# conjuntos de paquetes (packages/<set>.txt y <set>.aur.txt). 'base' va aparte.
PACKAGE_SETS=(gnome cli dev apps)

# -- arranque ----------------------------------------------------------------------------
MKINITCPIO_MODULES=()
# initramfs con busybox (udev) en vez del de systemd que trae Arch por defecto: el hook
# grub-btrfs-overlayfs solo funciona así. Permite arrancar un snapshot de snapper (solo
# lectura) desde GRUB con una capa escribible en RAM, como un live-cd.
# (keymap es el equivalente busybox de sd-vconsole; consolefont no, no hay FONT en vconsole.conf)
# resume: con busybox la hibernación necesita este hook y `resume=` en la línea del kernel
# (chroot-setup.sh lo añade solo si hay partición swap); con systemd era automático.
MKINITCPIO_HOOKS=(base udev autodetect microcode modconf kms keyboard keymap block filesystems resume fsck grub-btrfs-overlayfs)
KERNEL_CMDLINE="loglevel=4 nowatchdog"
KERNEL_CMDLINE_EXTRA=""       # parámetros propios del host
GRUB_GFXMODE=auto
GRUB_TIMEOUT=2

# -- servicios -----------------------------------------------------------------------------
# Se activan en el chroot si la unidad existe (los que vengan de AUR: POST_SERVICES)
SERVICES=(NetworkManager systemd-resolved systemd-timesyncd sshd fstrim.timer bluetooth gdm grub-btrfsd)
POST_SERVICES=()

# -- URLs ---------------------------------------------------------------------------------------
REPO_URL=https://github.com/1noro/arch-installs
DOTFILES_URL=https://github.com/1noro/dotfiles-yadm.git
