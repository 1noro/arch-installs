# /etc/tlp.d/10-t470.conf — ThinkPad T470 (BAT0 interna + BAT1 externa "power bridge")
# Documentación: https://linrunner.de/tlp/settings/

TLP_ENABLE=1

# --- CPU (intel_pstate, EPP vía HWP) -------------------------------------------
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# --- batería: conservar la capacidad ---------------------------------------------
# thinkpad_acpi soporta umbrales de carga en el T470 sin módulos extra.
# Para cargar al 100% una vez (viaje): sudo tlp fullcharge
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=80

# --- ahorro de energía en batería ----------------------------------------------------
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
SATA_LINKPWR_ON_AC="max_performance"
SATA_LINKPWR_ON_BAT="med_power_with_dipm"
USB_AUTOSUSPEND=1
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
