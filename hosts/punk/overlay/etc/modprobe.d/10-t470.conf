# Evita en el journal: "systemd-udevd: could not read from '/sys/module/pcc_cpufreq/initstate'".
# pcc_cpufreq no hace falta: la CPU usa intel_pstate.
blacklist pcc_cpufreq

# Touchpad Synaptics en modo RMI4/SMBus (multitouch real) en vez de PS/2 antiguo.
# Sin esto GNOME no recibe los gestos de 3-4 dedos. Si el touchpad fallara, quita esta línea.
options psmouse synaptics_intertouch=1
