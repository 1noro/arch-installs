# punk — ThinkPad T470 (Kaby Lake, Intel HD 620, NVMe, Wi-Fi Intel 8265).
# Hardware muy bien soportado por Linux: ajustes de bajo nivel en overlay/ y chroot.sh.
# shellcheck disable=SC2034

DISK_PREFER='^/dev/nvme'

# portátil: sin juegos, máquinas virtuales ni edición multimedia pesada.
# Añade 'media', 'gaming' o 'virt' aquí si los quieres.
PACKAGE_SETS=(gnome cli dev apps printing)

# KMS temprano de Intel (pantalla nativa desde el initramfs)
MKINITCPIO_MODULES=(i915)
# enable_guc=2: carga el firmware HuC (decodificación HEVC/VP9 por hardware en Kaby Lake)
KERNEL_CMDLINE_EXTRA="i915.enable_guc=2"

# tlp gestiona la energía (ver overlay/etc/tlp.d/10-t470.conf); tlp-pd expone sus
# perfiles al selector "Modo de energía" de GNOME (sustituye a power-profiles-daemon);
# thermald, el calor
SERVICES+=(tlp tlp-pd thermald avahi-daemon cups.service)
